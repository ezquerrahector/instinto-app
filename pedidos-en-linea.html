<style>
:root{--ink:#1d1c18;--ink2:#4a463f;--muted:#857e72;--gold:#bd9b4c;--gold-soft:#f1e9d6;--cream:#f7f5f0;--paper:#fff;--line:#e3ddd2;

.row{display:flex;gap:8px;flex-wrap:wrap}.row input[type=search]{flex:1;min-width:200px}
input[type=search],select,input[type=date],textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--paper)}

a{color:#755622}

.md{padding:20px}.md h3{margin:0 0 6px;font:500 18px Cinzel,serif;letter-spacing:.06em}.md p{margin:6px 0;color:var(--ink2);font-size:13px}
.md label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}.md input,.md select,.md textarea{width:100%}
.md .opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:13px;color:var(--ink)}
.md .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.md .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

.login{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center}

.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}

<div class="wrap">
<header class="top">
  <div class="brand"><h1>INSTINTO</h1><small>Tienda en línea · ventas, envíos y alertas</small></div>
  <div class="tools"><span class="sync" id="sync"></span>
    <button class="btn ghost sm" id="refresh" type="button" disabled>↻ Actualizar</button>
    <button class="btn ghost sm" id="notifyBtn" type="button" title="Avisos del navegador cuando entre un pedido">🔔 Avisos</button>
    <button class="btn ghost sm hidden" id="logout" type="button">Cerrar sesión</button></div>
</header>

<section id="loginBox" class="login"><p>Inicia sesión con una cuenta autorizada para ver las ventas de la tienda.</p><button class="btn" id="login" type="button">Acceder con Google</button></section>

<main id="app" class="hidden">
  <div id="callout" class="callout"></div>
  <div class="kpis" id="kpis"></div>
  <div class="alerts" id="alerts"></div>
  <div class="filters">
    <div class="chips" id="stageChips" role="tablist" aria-label="Etapa"></div>
    <div class="row">
      <input type="search" id="q" placeholder="Buscar folio, cliente, fragancia, teléfono o rastreo…" aria-label="Buscar">
      <select id="range" aria-label="Periodo"><option value="all">Todo</option><option value="1">Hoy</option><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option></select>
      <select id="sort" aria-label="Orden"><option value="urgent">Más urgentes primero</option><option value="new">Más recientes</option><option value="old">Más antiguos</option></select>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)"><input type="checkbox" id="showTest"> Incluir pruebas</label>
    </div>
  </div>
  <div class="meta" id="count" style="margin:0 2px 8px"></div>
  <div class="list" id="list"></div>

  <details class="legacy"><summary>Herramientas anteriores (V9 · pedidos de prueba y diagnóstico de inventario)</summary>
    <p class="meta">Pedidos de prueba sin cobro y diagnóstico de solo lectura. No son ventas.</p>
    <div class="row" style="margin:8px 0"><button class="btn ghost sm" id="v9load" type="button">Ver pedidos de prueba</button><button class="btn ghost sm" id="auditBtn" type="button">Revisar disponibilidad</button></div>
    <p id="status" class="meta"></p><table class="table"><tbody id="orders"></tbody></table>
    <p id="auditStatus" class="meta"></p><div id="auditResult"></div>
  </details>
</main>
</div>

<dialog id="dlg"><form method="dialog" class="md" id="dlgForm"></form></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="assets/admin-access.js"></script>
<script>

const app=firebase.initializeApp({apiKey:'AIzaSyBafY_htzgeMH5_J_h9-VscHHnrHdLX0IY',authDomain:'instinto-fragancias.firebaseapp.com',projectId:'instinto-fragancias',appId:'1:972424984397:web:5910eef68d595de71ee904'});

  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const money=c=>(Number(c||0)/100).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const when=ms=>ms?new Date(ms).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
const ago=ms=>{if(!ms)return'';const m=Math.round((Date.now()-ms)/60000);if(m<60)return`hace ${m} min`;const hh=Math.round(m/60);if(hh<48)return`hace ${hh} h`;return`hace ${Math.round(hh/24)} días`};
const folio=p=>p.id.slice(1,9).toUpperCase();
const ops=new Map();const opFor=k=>{if(!ops.has(k))ops.set(k,crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join(''));return ops.get(k)};
function toast(t){const e=h('div',{class:'toast',role:'status'},t);document.body.append(e);setTimeout(()=>e.remove(),3200)}
const MSG={labels_disabled:'La generación de guías no está habilitada.',labels_not_configured:'Falta configuración verificada de guías.',cost_difference:'El costo actual de la guía es mayor al cobrado.',
 shipment_uncertain_check_provider:'Respuesta incierta: revisa en Skydropx si se generó la guía antes de reintentar.',purchase_not_shippable:'El pedido no está pagado o requiere revisión.',
 refund_failed:'Mercado Pago no confirmó el reembolso.',already_in_transit_handle_return:'El paquete ya está en tránsito: gestiona una devolución.',forbidden:'Cuenta no autorizada.',
 invalid_session:'Tu sesión venció. Vuelve a iniciar sesión.',reason_required:'Escribe el motivo (mínimo 5 caracteres).',label_provider_rejected:'Skydropx rechazó la guía',
 shipment_in_progress:'Hay una generación de guía en curso; espera unos minutos.',pickup_provider_rejected:'La paquetería rechazó la recolección',
 invalid_pickup_window:'El horario debe ser futuro, dentro de 10 días y de al menos 2 horas.',label_not_ready:'Primero genera la guía.',operation_reused:'Esta operación ya se registró con otros datos.'};
async function call(path,body){const u=auth.currentUser;if(!u)throw Error('Inicia sesión');
 const r=await fetch(WEB+path,{method:body?'POST':'GET',cache:'no-store',headers:{Authorization:'Bearer '+await u.getIdToken(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok){const e=Error((MSG[d.error]||d.error||('Error '+r.status))+(d.detail?': '+d.detail:''));Object.assign(e,d);throw e}return d}

/* ---------- Modelo de etapas (solo lectura del estado que ya guarda el servidor) ---------- */
const REASON={payment_total_mismatch:'El monto pagado no coincide con el pedido',late_payment:'Pago recibido después de vencer la reserva',late_payment_no_stock:'Pago tardío y ya no hay esencia suficiente: considera reembolsar',
 insufficient_stock:'No hay esencia suficiente para este pedido',charged_back:'El cliente desconoció el cargo (contracargo)',in_mediation:'Pago en disputa en Mercado Pago',payment_reversal:'Mercado Pago revirtió el pago',
 second_approved_payment:'Se recibió un segundo pago aprobado: revisa si hay que reembolsar uno',reservation_mismatch:'La reserva de esencia no coincide',collector_mismatch:'El pago llegó a otra cuenta de Mercado Pago',
 payment_environment_mismatch:'Pago de prueba en ambiente real (o viceversa)',purchase_binding_mismatch:'El pago no corresponde a este pedido',invalid_payment_reference:'Referencia de pago inválida',unknown_purchase:'Pago sin pedido asociado'};
const why=r=>REASON[r]||r||'';
const IN_TRANSIT=new Set(['picked_up','in_transit','last_mile','delivery_attempt','delivered_to_branch','in_return']);
const TRACK={created:'Guía creada',picked_up:'Recolectado',in_transit:'En tránsito',last_mile:'En reparto',delivery_attempt:'Intento de entrega',delivered_to_branch:'En sucursal',
 delivered:'Entregado',exception:'Incidencia',in_return:'En devolución',canceled:'Cancelado',destroyed:'Destruido',retained:'Retenido'};
function stage(p){
 if(p.state==='cancelled')return'cancelado';if(p.state==='awaiting_payment')return'pago';if(p.state==='expired')return'vencido';
 if(p.state!=='paid')return'otro';const s=p.shipment,t=s?.trackingStatus;
 if(p.reviewRequired||['exception','retained','destroyed','in_return'].includes(t)||s?.state==='uncertain')return'atencion';
 if(s?.state!=='label_ready')return'enviar';
 if(t==='delivered')return'entregado';
 if(IN_TRANSIT.has(t))return'camino';
 return'recolectar';
}
const STAGES=[['accion','Por atender'],['enviar','Por enviar'],['recolectar','Por recolectar'],['camino','En camino'],['entregado','Entregados'],['atencion','Atención'],['cancelado','Cancelados'],['todos','Todos']];
const STAGE_PILL={enviar:['Por enviar','amber'],recolectar:['Esperando paquetería','blue'],camino:['En camino','blue'],entregado:['Entregado','green'],atencion:['Requiere atención','red'],
 cancelado:['Cancelado','gray'],pago:['Esperando pago','gray'],vencido:['Reserva vencida','gray'],otro:['—','gray']};
const STEP_IX={enviar:1,recolectar:2,camino:3,entregado:4,atencion:1};
const needsAction=p=>{const st=stage(p);return st==='atencion'||st==='enviar'||(st==='recolectar'&&p.pickup?.state!=='scheduled')};

let DATA={purchases:[],alerts:[]},filter={stage:'accion',q:'',range:'all',sort:'urgent',test:false},lastSeen=null,timer=null;
try{const f=JSON.parse(localStorage.getItem('instinto_web_filters')||'null');if(f)Object.assign(filter,f)}catch{}
try{lastSeen=Number(localStorage.getItem('instinto_web_lastseen'))||null}catch{}
const saveFilter=()=>{try{localStorage.setItem('instinto_web_filters',JSON.stringify(filter))}catch{}};

async function load(silent){
 $('refresh').disabled=true;if(!silent)$('sync').textContent='Actualizando…';
 try{DATA=await call('/overview');render();detectNew();$('sync').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'})}
 catch(e){$('sync').textContent=e.message}finally{$('refresh').disabled=false}
}
function visibleBase(){return DATA.purchases.filter(p=>filter.test||p.liveMode)}
function detectNew(){
 const paid=visibleBase().filter(p=>p.state==='paid'&&p.paidAt);const newest=Math.max(0,...paid.map(p=>p.paidAt));
 if(lastSeen&&newest>lastSeen){const n=paid.filter(p=>p.paidAt>lastSeen).length;toast(`🛍️ ${n} pedido(s) nuevo(s) pagado(s)`);chime();
   if('Notification' in window&&Notification.permission==='granted')new Notification('INSTINTO · Pedido nuevo',{body:`${n} pedido(s) pagado(s) en la tienda en línea`});}
 if(newest){lastSeen=Math.max(lastSeen||0,newest);try{localStorage.setItem('instinto_web_lastseen',String(lastSeen))}catch{}}
 const pend=visibleBase().filter(needsAction).length;
 document.title=(pend?`(${pend}) `:'')+'INSTINTO | Tienda en línea';
 try{parent!==window&&parent.postMessage({type:'instinto-web-pending',count:pend},location.origin)}catch{}
}

function renderCallout(){
 const base=visibleBase(),enviar=base.filter(p=>stage(p)==='enviar'),recoger=base.filter(p=>stage(p)==='recolectar'&&p.pickup?.state!=='scheduled'),attn=base.filter(p=>stage(p)==='atencion');
 const box=$('callout');box.replaceChildren();
 const parts=[];if(enviar.length)parts.push(`${enviar.length} por generar guía`);if(recoger.length)parts.push(`${recoger.length} por programar recolección`);if(attn.length)parts.push(`${attn.length} requieren atención`);
 if(!parts.length){box.className='callout ok';box.append(h('div',null,h('strong',null,'Todo al día'),h('p',null,'No hay pedidos pendientes de acción. Te avisaremos cuando entre uno nuevo.')));return}
 const total=enviar.length+recoger.length+attn.length;
 box.className='callout';box.append(h('div',null,h('strong',null,`Tienes ${total} pedido${total===1?'':'s'} por atender`),h('p',null,parts.join(' · '))),
  h('button',{class:'btn gold',type:'button',onclick:()=>{filter.stage='accion';saveFilter();render()}},'Ver pendientes'));
}
function renderKpis(){
 const paid=visibleBase().filter(p=>p.state==='paid'),now=Date.now(),day=86400000,start=new Date();start.setHours(0,0,0,0);
 const sum=(arr)=>arr.reduce((s,p)=>s+(p.totalCents||0),0),units=arr=>arr.reduce((n,p)=>n+p.items.reduce((m,i)=>m+i.qty,0),0);
 const today=paid.filter(p=>p.paidAt>=start.getTime()),w=paid.filter(p=>p.paidAt>=now-7*day),m=paid.filter(p=>p.paidAt>=now-30*day);
 const days=[...Array(14)].map((_,i)=>{const d0=start.getTime()-(13-i)*day;return sum(paid.filter(p=>p.paidAt>=d0&&p.paidAt<d0+day))});const mx=Math.max(1,...days);

 const k=$('kpis');k.replaceChildren(
